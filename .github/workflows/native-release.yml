name: Native app builds (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run sync:android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Build release AAB (unsigned)
        run: cd android && ./gradlew bundleRelease --no-daemon
      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/furevrnac-${GITHUB_REF_NAME}-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/furevrnac-${GITHUB_REF_NAME}-release-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: furevrnac-android
          path: artifacts/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
